const { useState, useEffect, useRef, Fragment } = React;

// ─────────────────────────────────────────────────────────────
// DATE HELPERS
// ─────────────────────────────────────────────────────────────
const parseDate = d => {
  if (!d) return new Date(NaN);
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
  return new Date(d);
};
const TODAY    = new Date();
const CURR_Q   = Math.ceil((TODAY.getMonth() + 1) / 3);
const dBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const dFrom    = d => Math.max(0, dBetween(TODAY, d));
const dAgo     = d => Math.max(0, dBetween(d, TODAY));
const fmt      = d => parseDate(d).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
const fmtS     = d => parseDate(d).toLocaleDateString('en-US', {month:'short',day:'numeric'});
const fmtUSD   = n => !n ? '$0' : n >= 1000000 ? `$${(n/1e6).toFixed(1)}M` : `$${(n/1000).toFixed(0)}K`;
const greeting = () => { const h = TODAY.getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };

// SMARTSHEET BACKEND
// ─────────────────────────────────────────────────────────────

let API_TOKEN = '';
const apiFetch = (path, opts={}) => fetch(`${API}${path}`, {
  ...opts,
  headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${API_TOKEN}`, ...(opts.headers||{}) },
});

let PIPELINE = [];
let LEADS    = [];

    moorage: '1,600ft moorage  ·  Vessels up to 450ft  ·  DD1 1,000T · DD2 500T  ·  8 Piersides  ·  SS1  ·  2 Boathouses',
    cranes: '50T · 40T · 10T',

  },

    moorage: '1,800ft moorage  ·  Vessels up to 450ft  ·  500 LT Dry Dock  ·  750T & 300T Railways  ·  50,000 sqft covered  ·  3 Harbor Slips',
    cranes: '75T · 60T · 30T · 15T',
    ganttRows: ['LgWay','SmWay','DryDock','Outside','Slip1','Slip2','Slip3'],
    ganttLabels: {LgWay:'Large Railway',SmWay:'Small Railway (Scrap)',DryDock:'Dry Dock',Outside:'Outside Moorage',Slip1:'Harbor Slip 1',Slip2:'Harbor Slip 2',Slip3:'Harbor Slip 3'},
  },
};

const ANA_BERTH_KEY = {
  'Large Railway':'LgWay','Small Railway':'SmWay','Dry Dock':'DryDock',
  'Outside Moorage':'Outside','Harbor Slip 1':'Slip1','Harbor Slip 2':'Slip2','Harbor Slip 3':'Slip3',
};

function transformBerths(rows, yard) {
  const yName = yard === 'ballard' ? 'Ballard' : 'Anacortes';
  return rows.filter(r => r['Yard'] === yName).map(r => ({
    id:       (r['Berth ID']||'').toLowerCase(),
    name:     r['Berth ID'],
    fullName: r['Full Name'],
    section:  (r['Section']||'').toLowerCase(),
    len:      r['Length (ft)'],
    beam:     r['Beam (ft)'],
    draft:    r['Draft (ft)'],
    cap:      r['Capacity'],
    status:   (r['Status']||'available').toLowerCase(),
    mapX:     r['Map X'] !== null && r['Map X'] !== undefined ? Number(r['Map X']) : null,
    mapY:     r['Map Y'] !== null && r['Map Y'] !== undefined ? Number(r['Map Y']) : null,
    _rowId:   r._rowId,
    vessel:   (r['Vessel Name'] && (r['Status']||'').toLowerCase() !== 'available') ? {
      name: r['Vessel Name'], loa: null,
      wo: r['Work Order'], arrival: r['Arrival Date'],
      departure: r['Departure Date'], notes: r['Notes'],
    } : null,
  }));
}

function transformSchedule(rows, yard) {
  const yName = yard === 'ballard' ? 'Ballard' : 'Anacortes';
  return rows.filter(r => r['Yard'] === yName).map(r => {
    const raw = r['Berth']||'';
    const berth = yard === 'anacortes' ? (ANA_BERTH_KEY[raw]||raw) : raw;
    return { vessel:r['Vessel Name'], berth, loa:r['LOA (ft)'], arrival:r['Arrival Date'], departure:r['Departure Date'], _rowId:r._rowId };
  });
}

function transformPipeline(rows) {
  return rows.map(r => ({
    q:      parseInt((r['Quarter']||'Q0').replace('Q','')),
    vessel: r['Vessel Name'],
    rep:    r['Rep']||'—',
    value:  Number(r['Value ($)'])||0,
    loc:    r['Yard']==='Off Site' ? 'Off Site' : `${r['Yard']||''} — ${r['Berth']||''}`,
    pop:    r['Period']||'—',
    status: (r['Status']||'').toLowerCase(),
    notes:  r['Notes']||'',
    _rowId: r._rowId,
  }));
}

function transformLeads(rows) {
  return rows.map(r => ({
    _rowId:      r._rowId,
    firstName:   r['First Name']||'',
    lastName:    r['Last Name']||'',
    company:     r['Company / Vessel Owner']||r['Company']||'',
    email:       r['Email Address']||r['Email']||'',
    phone:       r['Phone Number']||r['Phone']||'',
    vessel:      r['Vessel Name']||'',
    vesselType:  r['Vessel Type']||'',
    yard:        r['Preferred Yard']||'No Preference',
    loa:         r['LOA (ft)']||r['LOA']||'',
    beam:        r['Beam (ft)']||r['Beam']||'',
    draft:       r['Draft (ft)']||r['Draft']||'',
    arrival:     r['Estimated Arrival']||'',
    duration:    r['Est. Duration (days)']||r['Duration']||'',
    services:    r['Services Needed']||r['Services Requested']||r['Services']||r['Work Type']||'',
    description: r['Project Description']||'',
    budget:      r['Estimated Budget']||'',
    assignedRep: r['Assigned Rep']||r['Rep']||'',
    status:      r['Lead Status']||'New — Needs Review',
    lostReason:  r['Lost Reason']||'',
    submitted:   r['Submission Date']||r['Date Submitted']||r['Created']||'',
  })).sort((a,b) => {
    const da = a.submitted ? parseDate(a.submitted) : new Date(0);
    const db = b.submitted ? parseDate(b.submitted) : new Date(0);
    if (!isNaN(db) && !isNaN(da) && db-da !== 0) return db-da;
    return b._rowId - a._rowId;
  });
}

function transformClients(rows) {
  return rows.map(r => ({
    _rowId:          r._rowId,
    vesselName:      r['Vessel Name']||'',
    ownerCompany:    r['Owner / Company']||'',
    firstName:       r['First Name']||'',
    lastName:        r['Last Name']||'',
    email:           r['Email']||'',
    phone:           r['Phone']||'',
    assignedRep:     r['Assigned Rep']||'',
    vesselType:      r['Vessel Type']||'',
    loa:             r['LOA (ft)']||'',
    beam:            r['Beam (ft)']||'',
    draft:           r['Draft (ft)']||'',
    grossTonnage:    r['Gross Tonnage']||'',
    yearBuilt:       r['Year Built']||'',
    clientStatus:    r['Client Status']||'Prospect',
    preferredYard:   r['Preferred Yard']||'No Preference',
    lastContactDate: r['Last Contact Date']||'',
    notes:           r['Notes']||'',
    source:          r['Source']||'',
  })).sort((a,b) => a.vesselName.localeCompare(b.vesselName));
}

async function loadFromSmartsheet() {
  const [bR, sR, pR] = await Promise.all([
    apiFetch('/api/berths'), apiFetch('/api/schedule'), apiFetch('/api/pipeline'),
  ]);
  if (!bR.ok || !sR.ok || !pR.ok) throw new Error('Could not reach the DockOps proxy server.');
  const [bD, sD, pD] = await Promise.all([bR.json(), sR.json(), pR.json()]);
  YARDS = {
    ballard:   { ...YARD_META.ballard,   docks:transformBerths(bD,'ballard'),   schedule:transformSchedule(sD,'ballard')   },
    anacortes: { ...YARD_META.anacortes, docks:transformBerths(bD,'anacortes'), schedule:transformSchedule(sD,'anacortes') },
  };
  PIPELINE = transformPipeline(pD);
  try { const lR = await apiFetch('/api/leads');   if (lR.ok) LEADS   = transformLeads(await lR.json());   } catch(e) { console.warn('Leads unavailable:', e); }
  try { const cR = await apiFetch('/api/clients'); if (cR.ok) CLIENTS = transformClients(await cR.json()); } catch(e) { console.warn('Clients unavailable:', e); }
}

// ─────────────────────────────────────────────────────────────
// VESSEL AUTOCOMPLETE
// ─────────────────────────────────────────────────────────────
function VesselAutocomplete({value, onChange, disabled, placeholder}) {
  const [sugg, setSugg] = useState([]);
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const timer = useRef(null);

  const handleChange = e => {
    const v = e.target.value;
    onChange(v);
    clearTimeout(timer.current);
    if (v.length < 1) { setSugg([]); setOpen(false); return; }
    timer.current = setTimeout(async () => {
      setBusy(true);
      try {
        const r = await apiFetch(`/api/clients/search?q=${encodeURIComponent(v)}`);
        if (r.ok) { const d = await r.json(); setSugg(d); setOpen(d.length > 0); }
      } catch(e) { console.warn('Autocomplete failed:', e); }
      finally { setBusy(false); }
    }, 280);
  };

  const pick = s => { onChange(s.vesselName||s['Vessel Name']||s); setSugg([]); setOpen(false); };

  return(
    <div style={{position:'relative'}}>
      <div style={{position:'relative'}}>
        <input value={value} onChange={handleChange} disabled={disabled}
          onBlur={()=>setTimeout(()=>setOpen(false),180)}
          onFocus={()=>sugg.length>0&&setOpen(true)}
          placeholder={placeholder||'Type vessel name…'}
          style={{...INPUT_S,paddingRight:'28px'}}
        />
        {busy&&<span style={{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',fontSize:'10px',color:'#475569'}}>…</span>}
      </div>
      {open&&sugg.length>0&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'#0f2044',border:'1px solid rgba(6,182,212,0.3)',borderRadius:'7px',zIndex:300,maxHeight:'200px',overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.6)'}}>
          {sugg.map((s,i)=>(
            <div key={s._rowId||i} className="ac-item" onMouseDown={()=>pick(s)}
              style={{padding:'8px 12px',cursor:'pointer',borderBottom:i<sugg.length-1?'1px solid rgba(255,255,255,0.05)':'none'}}>
              <div style={{fontSize:'13px',color:'#e2e8f0',fontWeight:500}}>{s.vesselName||s['Vessel Name']}</div>
              {(s.ownerCompany||s.vesselType)&&<div style={{fontSize:'11px',color:'#475569',marginTop:'2px'}}>{[s.ownerCompany,s.vesselType,s.loa?s.loa+'ft LOA':''].filter(Boolean).join(' · ')}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DockCard({dock, onRefresh}) {
  const{name,fullName,section,cap,len,beam,draft,status,vessel,_rowId}=dock;

    section==='drydock'   ? `Dry Dock · ${cap} · ${len}ft × ${beam}ft · ${draft}ft draft` :
    section==='railway'   ? `Railway · ${cap} · ${len}ft × ${beam}ft · ${draft}ft draft` :
    section==='sternside' ? `Stern-Side · ${len}ft · ${draft}ft max draft` :
    section==='pier'      ? `Pier-Side · ${len}ft${draft ? ' · '+draft+'ft draft' : ''}` :

  const toInputDate = d => {if(!d)return'';const dt=parseDate(d);if(isNaN(dt))return'';const mm=String(dt.getMonth()+1).padStart(2,'0');const dd=String(dt.getDate()).padStart(2,'0');return`${dt.getFullYear()}-${mm}-${dd}`;};
  const openEdit = () => { setForm({status:status||'available',vesselName:vessel?.name||'',arrival:toInputDate(vessel?.arrival),departure:toInputDate(vessel?.departure),wo:vessel?.wo||'',notes:vessel?.notes||''}); setEditing(true); };
  const handleSave = async () => {
    setSaving(true); setSaveErr('');
    const payload={'Status':capStatus(form.status)};
    if(form.status!=='available'){payload['Vessel Name']=form.vesselName;payload['Arrival Date']=form.arrival;payload['Departure Date']=form.departure;payload['Work Order']=form.wo;payload['Notes']=form.notes;}
    try {
      const r=await apiFetch(`/api/berths/${_rowId}`,{method:'PUT',body:JSON.stringify(payload)});
      if(r.ok){setEditing(false);onRefresh();}
      else{const d=await r.json().catch(()=>({}));setSaveErr(d.error||`Save failed (${r.status})`);}

          <div style={{fontSize:'11px',color:'#475569',marginTop:'3px'}}>{sub}</div>

        <span style={{fontSize:'10px',fontWeight:700,color:'#06b6d4',letterSpacing:'0.08em'}}>EDITING</span>
      </div>
      <div>
        <label style={LABEL_S}>Status</label>

          <option value='occupied'    style={SEL_S}>Occupied</option>
          <option value='reserved'    style={SEL_S}>Reserved</option>

            <div><label style={LABEL_S}>Vessel Name</label><VesselAutocomplete value={form.vesselName} onChange={v=>setForm(f=>({...f,vesselName:v}))} placeholder='Vessel name'/></div>

        </>

      <div style={{display:'flex',gap:'8px',justifyContent:'flex-end',paddingTop:'2px'}}>

          {saving?'Saving…':'Save to Smartsheet'}
        </button>
      </div>
    </div>
  );
  return(
    <div style={{...CARD_S,border:'1px solid rgba(255,255,255,0.07)',borderLeft:`3px solid ${s.color}`}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'10px'}}>
        <div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'17px',fontWeight:700,color:'#e2e8f0'}}>{fullName||name}</div>
          <div style={{fontSize:'11px',color:'#475569',marginTop:'3px'}}>{sub}</div>

        <div style={{display:'flex',gap:'10px'}}>
          <div style={{background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:'7px',padding:'8px 12px',flex:1}}>

            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'15px',fontWeight:600,color:'#e2e8f0'}}>{fmt(vessel.arrival)}</div>
            <div style={{fontSize:'11px',color:'#475569',marginTop:'2px'}}>{dAgo(vessel.arrival)}d in dock</div>
          </div>
          <div style={{background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.2)',borderRadius:'7px',padding:'8px 12px',flex:1}}>
            <div style={{fontSize:'10px',color:'#f59e0b',fontWeight:700,letterSpacing:'0.08em',marginBottom:'3px'}}>DEPARTURE</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'15px',fontWeight:600,color:'#e2e8f0'}}>{fmt(vessel.departure)}</div>
            <div style={{fontSize:'11px',color:'#475569',marginTop:'2px'}}>{dFrom(vessel.departure)}d remaining</div>

        {vessel.wo&&vessel.wo!=='—'&&<div style={{fontSize:'11px',color:'#475569',fontFamily:"'JetBrains Mono',monospace"}}>{vessel.wo}</div>}

      </>}
    </div>
  );

// ─────────────────────────────────────────────────────────────
function Gantt({yard}) {
  const Y=YARDS[yard];
  const [hov,setHov]=useState(null);
  const defaultStart=()=>new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1);
  const [calStart,setCalStart]=useState(defaultStart);
  const shift=n=>setCalStart(s=>new Date(s.getFullYear(),s.getMonth()+n,1));
  const jumpToToday=()=>setCalStart(defaultStart());
  const buildCal=start=>{
    const months=[];let total=0;
    for(let i=0;i<4;i++){const d=new Date(start.getFullYear(),start.getMonth()+i,1);const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const crossYear=d.getFullYear()!==start.getFullYear();const label=d.toLocaleDateString('en-US',{month:'long'})+(crossYear||i===0?` ${d.getFullYear()}`:'');months.push({n:label,d:days});total+=days;}
    const divs=[];let cum=0;for(let i=0;i<3;i++){cum+=months[i].d;divs.push((cum/total)*100);}
    return{months,divs,total};
  };
  const{months:MONTHS,divs:DIVS,total:CAL_D}=buildCal(calStart);
  const CAL_S=calStart;
  const todayOffset=Math.round((TODAY-CAL_S)/86400000);
  const TDPCT=todayOffset>=0&&todayOffset<=CAL_D?(todayOffset/CAL_D)*100:null;
  const endDate=new Date(calStart.getFullYear(),calStart.getMonth()+4,0);
  const rangeLabel=`${calStart.toLocaleDateString('en-US',{month:'short',year:'numeric'})} — ${endDate.toLocaleDateString('en-US',{month:'short',year:'numeric'})}`;
  const LW=140;
  const geom=(a,d)=>{const sd=Math.round((parseDate(a)-CAL_S)/86400000),ed=Math.round((parseDate(d)-CAL_S)/86400000);if(ed<=0||sd>=CAL_D)return null;const cs=Math.max(0,sd),ce=Math.min(CAL_D,ed);return{left:`${(cs/CAL_D)*100}%`,width:`${((ce-cs)/CAL_D)*100}%`,radius:`${sd<=0?0:4}px ${ed>=CAL_D?0:4}px ${ed>=CAL_D?0:4}px ${sd<=0?0:4}px`};};
  const rows=Y.ganttRows.map(k=>({k,label:Y.ganttLabels[k],bars:Y.schedule.filter(s=>s.berth===k).map(s=>{const g=geom(s.arrival,s.departure);return g?{...s,g,color:vColor(s.vessel)}:null;}).filter(Boolean)}));
  const BTN={background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'6px',color:'#94a3b8',padding:'5px 13px',fontSize:'12px',fontWeight:600,cursor:'pointer'};
  const BTN_TODAY={...BTN,background:'rgba(6,182,212,0.1)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.25)'};
  return(
    <div style={{background:'#0a1323',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'10px',padding:'18px 18px 14px',marginBottom:'24px'}}>

        <span style={{fontSize:'11px',fontWeight:700,color:'#475569',letterSpacing:'0.1em'}}>DOCK AVAILABILITY CALENDAR</span>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <button onClick={()=>shift(-1)} style={BTN}>← Prev</button>

          <button onClick={jumpToToday} style={BTN_TODAY}>Today</button>
          <button onClick={()=>shift(1)} style={BTN}>Next →</button>
        </div>
      </div>
      <div style={{display:'flex'}}>
        <div style={{width:LW+'px',flexShrink:0}}>
          <div style={{height:'24px'}}/>
          {rows.map(({k,label})=>(
            <div key={k} style={{height:'32px',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:'10px'}}>

            </div>
          ))}
        </div>
        <div style={{flex:1,minWidth:0,position:'relative'}}>
          <div style={{display:'flex',height:'24px'}}>
            {MONTHS.map((m,i)=>(<div key={m.n} style={{flex:`${m.d} 0 0`,fontSize:'10px',fontWeight:700,color:'#475569',letterSpacing:'0.06em',textAlign:'center',lineHeight:'24px',borderLeft:i>0?'1px solid rgba(255,255,255,0.06)':'none'}}>{m.n.toUpperCase()}</div>))}
          </div>
          <div style={{position:'relative'}}>
            {DIVS.map((p,i)=><div key={i} style={{position:'absolute',left:`${p}%`,top:0,bottom:0,width:'1px',background:'rgba(255,255,255,0.05)',zIndex:1}}/>)}
            {TDPCT!==null&&(
              <div style={{position:'absolute',left:`${TDPCT}%`,top:'-30px',bottom:0,width:'1px',background:'rgba(251,191,36,0.5)',zIndex:10}}>

    </div>
  );

// ─────────────────────────────────────────────────────────────
// HOME TAB
// ─────────────────────────────────────────────────────────────
function HomeTab({onNavigate}) {
  const yardStats = Object.entries(YARDS).map(([key, yard]) => ({
    key, label: key==='ballard'?'Ballard':'Anacortes',
    total: yard.docks.length,
    occ:   yard.docks.filter(d=>d.status==='occupied').length,
    avail: yard.docks.filter(d=>d.status==='available').length,
    res:   yard.docks.filter(d=>d.status==='reserved').length,
    maint: yard.docks.filter(d=>d.status==='maintenance').length,
  }));

  // Upcoming berth availability: occupied berths departing in next 30 days
  const upcoming = [];
  Object.entries(YARDS).forEach(([key, yard]) => {
    yard.docks.forEach(dock => {
      if (dock.vessel && dock.vessel.departure) {
        const dep = parseDate(dock.vessel.departure);
        const daysUntil = Math.round((dep - TODAY) / 86400000);
        if (daysUntil >= 0 && daysUntil <= 30) {
          upcoming.push({...dock, yardKey:key, yardLabel:key==='ballard'?'Ballard':'Anacortes', daysUntil});
        }
      }
    });
  });
  upcoming.sort((a,b)=>a.daysUntil-b.daysUntil);

  const newLeads    = LEADS.filter(l=>l.status==='New — Needs Review');
  const quotedLeads = LEADS.filter(l=>l.status==='Quoted');

  const wonQ  = PIPELINE.filter(p=>p.status==='won'&&p.q===CURR_Q).reduce((a,p)=>a+p.value,0);
  const estQ  = PIPELINE.filter(p=>p.status==='estimating').reduce((a,p)=>a+p.value,0);
  const totQ  = PIPELINE.filter(p=>p.q===CURR_Q).reduce((a,p)=>a+p.value,0);

  return(
    <div>
      <div style={{marginBottom:'24px'}}>
        <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9'}}>{greeting()}, SMI Sales.</h1>
        <p style={{fontSize:'13px',color:'#64748b',marginTop:'4px'}}>{TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</p>
      </div>

      {/* Yard Status */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',marginBottom:'28px'}}>
        {yardStats.map(y=>(
          <div key={y.key} style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderLeft:'3px solid #06b6d4',borderRadius:'10px',padding:'20px 22px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'18px',fontWeight:700,color:'#e2e8f0'}}>SMI — {y.label}</div>
              <button onClick={()=>onNavigate('yard')} style={{background:'transparent',color:'#06b6d4',border:'none',fontSize:'12px',cursor:'pointer',fontWeight:600}}>View yard →</button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
              {[['Available',y.avail,'#10b981'],['Occupied',y.occ,'#f59e0b'],['Reserved',y.res,'#60a5fa'],['Maintenance',y.maint,'#f87171']].map(([label,val,color])=>(
                <div key={label} style={{textAlign:'center'}}>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'28px',fontWeight:700,color,lineHeight:1}}>{val}</div>
                  <div style={{fontSize:'10px',color:'#475569',marginTop:'3px'}}>{label}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px'}}>
        {/* Upcoming Availability */}
        <div>
          <SecH label='Upcoming Availability' sub='Berths opening in the next 30 days'/>
          {upcoming.length===0
            ? <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'8px',padding:'20px',textAlign:'center',color:'#334155',fontSize:'13px'}}>No departures scheduled in the next 30 days.</div>
            : <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {upcoming.map((dock)=>{
                const urgent = dock.daysUntil <= 7;
                return(
                  <div key={dock.id} style={{background:'#0d1728',border:`1px solid ${urgent?'rgba(16,185,129,0.3)':'rgba(255,255,255,0.07)'}`,borderLeft:`3px solid ${urgent?'#10b981':'#475569'}`,borderRadius:'8px',padding:'12px 14px',display:'flex',alignItems:'center',gap:'12px'}}>
                    <div style={{width:'48px',height:'48px',borderRadius:'8px',background:urgent?'rgba(16,185,129,0.12)':'rgba(100,116,139,0.08)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Barlow Condensed',sans-serif",fontSize:'14px',fontWeight:700,color:urgent?'#10b981':'#64748b',flexShrink:0,textAlign:'center',lineHeight:1.1}}>
                      {dock.daysUntil===0?'Today':`${dock.daysUntil}d`}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'13px',fontWeight:600,color:'#e2e8f0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{dock.fullName||dock.name} <span style={{fontSize:'11px',color:'#475569',fontWeight:400}}>· {dock.yardLabel}</span></div>
                      <div style={{fontSize:'11px',color:'#64748b',marginTop:'2px'}}>{dock.vessel.name} · departs {fmtS(dock.vessel.departure)}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          }
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:'24px'}}>
          {/* Needs Attention */}
          <div>
            <SecH label='Needs Attention' sub='Leads waiting for a response'/>
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              {newLeads.length>0&&(
                <div style={{background:'rgba(96,165,250,0.08)',border:'1px solid rgba(96,165,250,0.2)',borderRadius:'8px',padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'24px',fontWeight:700,color:'#60a5fa'}}>{newLeads.length}</div>
                    <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>New {newLeads.length===1?'lead':'leads'} — not yet reviewed</div>
                  </div>
                  <button onClick={()=>onNavigate('sales')} style={{background:'rgba(96,165,250,0.12)',color:'#60a5fa',border:'1px solid rgba(96,165,250,0.3)',padding:'7px 14px',borderRadius:'6px',fontSize:'12px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>Review now →</button>
                </div>
              )}
              {quotedLeads.length>0&&(
                <div style={{background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:'8px',padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'24px',fontWeight:700,color:'#06b6d4'}}>{quotedLeads.length}</div>
                    <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>Quoted — awaiting client response</div>
                  </div>
                  <button onClick={()=>onNavigate('sales')} style={{background:'rgba(6,182,212,0.12)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.3)',padding:'7px 14px',borderRadius:'6px',fontSize:'12px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>View in Sales →</button>
                </div>
              )}
              {newLeads.length===0&&quotedLeads.length===0&&(
                <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'8px',padding:'18px',textAlign:'center',color:'#334155',fontSize:'13px'}}>All caught up — no pending follow-ups.</div>
              )}
            </div>
          </div>

          {/* Pipeline Pulse */}
          <div>
            <SecH label={`Pipeline Pulse — Q${CURR_Q} ${TODAY.getFullYear()}`} sub='Revenue snapshot for the current quarter'/>
            <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',padding:'18px 20px'}}>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px',marginBottom:'14px'}}>
                {[['Closed Won',wonQ,'#10b981'],['Estimating',estQ,'#f59e0b'],['Q Total',totQ,'#e2e8f0']].map(([label,val,color])=>(
                  <div key={label} style={{textAlign:'center'}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'22px',fontWeight:700,color}}>{fmtUSD(val)}</div>
                    <div style={{fontSize:'10px',color:'#475569',marginTop:'3px'}}>{label}</div>
                  </div>
                ))}
              </div>
              <div style={{textAlign:'right'}}>
                <button onClick={()=>onNavigate('sales')} style={{background:'transparent',color:'#06b6d4',border:'none',fontSize:'12px',cursor:'pointer',fontWeight:600}}>Full sales view →</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

  const Y = YARDS[yard];
  const docks = Y.docks;
  const cnt = {total:docks.length,occ:docks.filter(d=>d.status==='occupied').length,avail:docks.filter(d=>d.status==='available').length,res:docks.filter(d=>d.status==='reserved').length,maint:docks.filter(d=>d.status==='maintenance').length};
  const secs = yard==='ballard' ? [
    {key:'drydock',   label:'Dry Docks',       sub:'DD1: 200ft · 1,000T · 16ft  ·  DD2: 100ft · 500T · 12ft', cols:2},
    {key:'sternside', label:'Stern-Side',       sub:'SS1: 100ft · 16ft max draft · Warehouse-to-aft-deck access', cols:1},
    {key:'pier',      label:'Pier-Side Berths', sub:'PS1–PS3: 362ft  ·  PS4–PS6: 401ft  ·  PS7–PS8: 218ft', cols:3},
    {key:'boathouse', label:'Boathouses',       sub:'BH1: 82.5ft · 12ft draft  ·  BH2: 82.5ft · 17ft draft', cols:2},
  ] : [
    {key:'railway',   label:'Railways',        sub:'Large: 750T · 130×50ft · 12.5ft draft  ·  Small: 300T · 90×30ft · 10ft (Scrap Only)', cols:2},
    {key:'drydock',   label:'Dry Dock',        sub:'500 LT', cols:1},
    {key:'pier',      label:'Outside Moorage', sub:'580ft total', cols:1},

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9'}}>{yard==='ballard'?'SMI-B':'SMI-A'}</h1>
          <p style={{fontSize:'13px',color:'#64748b',marginTop:'4px'}}>{Y.subtitle}</p>
        </div>
        <div style={{display:'flex',background:'rgba(255,255,255,0.04)',borderRadius:'8px',border:'1px solid rgba(255,255,255,0.09)',padding:'3px',gap:'2px'}}>
          {[{id:'ballard',label:'Ballard'},{id:'anacortes',label:'Anacortes'}].map(y=>(
            <button key={y.id} onClick={()=>setYard(y.id)} style={{background:yard===y.id?'#0f2044':'transparent',color:yard===y.id?'#06b6d4':'#4b5563',border:'none',padding:'6px 20px',borderRadius:'6px',fontSize:'13px',fontWeight:600,cursor:'pointer'}}>
              {y.label}
            </button>
          ))}
        </div>
      </div>
      <div style={{background:'#0a1828',border:'1px solid rgba(255,255,255,0.06)',borderRadius:'8px',padding:'10px 16px',marginBottom:'16px'}}>
        <div style={{fontSize:'11px',color:'#2d4a6a'}}>{Y.moorage}  ·  Cranes: {Y.cranes}</div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:'10px',marginBottom:'20px'}}>
        {[['Total',cnt.total,null],['Available',cnt.avail,'#10b981'],['Occupied',cnt.occ,'#f59e0b'],['Reserved',cnt.res,'#60a5fa'],['Maintenance',cnt.maint,'#f87171']].map(([label,value,dot])=>(
          <div key={label} style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',padding:'16px 18px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'}}>
              {dot&&<span style={{width:'7px',height:'7px',borderRadius:'50%',background:dot,display:'inline-block'}}/>}
              <span style={{fontSize:'11px',color:'#64748b'}}>{label}</span>

          </div>
        ))}
      </div>
      {yard==='ballard'&&<DraftLegend/>}
      {yard==='ballard'&&(
        <div style={{marginBottom:'20px'}}>
          <button onClick={()=>setShowMap(v=>!v)} style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:'7px',color:'#64748b',padding:'7px 16px',fontSize:'12px',fontWeight:600,cursor:'pointer'}}>
            {showMap?'▲ Hide yard map':'▼ Show yard map (ops view)'}
          </button>
          {showMap&&<div style={{marginTop:'12px'}}><BallardYardMap/></div>}
        </div>
      )}
      {secs.map(({key,label,sub,cols})=>{
        const items=docks.filter(d=>d.section===key);
        if(!items.length) return null;
        return(
          <div key={key} style={{marginBottom:'28px'}}>
            <SecH label={label} sub={sub}/>
            <div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:'14px'}}>
              {items.map(d=><DockCard key={d.id} dock={d} onRefresh={onRefresh}/>)}
            </div>
          </div>
        );
      })}
      <SecH label='Availability Calendar' sub='4-month forward view'/>
      <Gantt yard={yard}/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// CLIENT FORM (Add or Edit)
// ─────────────────────────────────────────────────────────────
function ClientForm({initial, onSave, onCancel}) {
  const isEdit = !!initial;
  const [form, setForm] = useState(initial || {
    vesselName:'',ownerCompany:'',firstName:'',lastName:'',email:'',phone:'',
    assignedRep:'',vesselType:'',loa:'',beam:'',draft:'',grossTonnage:'',yearBuilt:'',
    clientStatus:'Prospect',preferredYard:'No Preference',lastContactDate:'',notes:'',
  });
  const [saving,  setSaving]  = useState(false);
  const [err,     setErr]     = useState('');
  const [dupWarn, setDupWarn] = useState('');
  const set = (k, v) => setForm(f=>({...f,[k]:v}));

  const handleSave = async () => {
    if (!form.vesselName.trim()) { setErr('Vessel Name is required.'); return; }
    setSaving(true); setErr('');
    const payload = {
      'Vessel Name':       form.vesselName,
      'Owner / Company':   form.ownerCompany,
      'First Name':        form.firstName,
      'Last Name':         form.lastName,
      'Email':             form.email,
      'Phone':             form.phone,
      'Assigned Rep':      form.assignedRep,
      'Vessel Type':       form.vesselType,
      'LOA (ft)':          form.loa,
      'Beam (ft)':         form.beam,
      'Draft (ft)':        form.draft,
      'Gross Tonnage':     form.grossTonnage,
      'Year Built':        form.yearBuilt,
      'Client Status':     form.clientStatus,
      'Preferred Yard':    form.preferredYard,
      'Last Contact Date': form.lastContactDate,
      'Notes':             form.notes,
    };
    try {
      let r;
      if (isEdit) { r = await apiFetch(`/api/clients/${initial._rowId}`, {method:'PUT',  body:JSON.stringify(payload)}); }
      else        { r = await apiFetch('/api/clients',                    {method:'POST', body:JSON.stringify(payload)}); }
      const data = await r.json().catch(()=>({}));
      if (r.ok) { onSave(); }
      else if (r.status===409) { setSaving(false); setDupWarn(data.error||'A record for this vessel already exists.'); }
      else { setErr(data.error||`Save failed (${r.status})`); }
    } catch(e) { setErr(e.message||'Save failed — check your connection'); }
    finally { setSaving(false); }
  };

  const ROW2 = {display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'12px'};
  const ROW3 = {display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px',marginBottom:'12px'};
  const SECT = label => <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'10px',marginTop:'16px',borderTop:'1px solid rgba(255,255,255,0.05)',paddingTop:'14px'}}>{label}</div>;

  return(
    <div style={{background:'#0a1828',borderRadius:'12px',border:'1px solid rgba(255,255,255,0.08)',padding:'24px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <h2 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'22px',fontWeight:700,color:'#f1f5f9'}}>{isEdit?`Edit — ${initial.vesselName}`:'Add New Vessel'}</h2>
        <button onClick={onCancel} style={{background:'transparent',border:'none',color:'#64748b',fontSize:'22px',cursor:'pointer',lineHeight:1,padding:'0 4px'}}>×</button>
      </div>

      <div style={{marginBottom:'12px'}}>
        <label style={LABEL_S}>Vessel Name <span style={{color:'#f87171'}}>*</span></label>
        {isEdit
          ? <input style={{...INPUT_S,opacity:0.6,cursor:'not-allowed'}} value={form.vesselName} disabled/>
          : <VesselAutocomplete value={form.vesselName} onChange={v=>{set('vesselName',v);setDupWarn('');}} placeholder='Start typing vessel name…'/>
        }
        {dupWarn&&<div style={{fontSize:'12px',color:'#f59e0b',marginTop:'5px'}}>⚠ {dupWarn} — <button onClick={()=>setDupWarn('')} style={{background:'transparent',border:'none',color:'#06b6d4',cursor:'pointer',fontSize:'12px',textDecoration:'underline'}}>dismiss</button></div>}
      </div>

      {SECT('CONTACT INFORMATION')}
      <div style={ROW2}>
        <div><label style={LABEL_S}>Owner / Company</label><input style={INPUT_S} value={form.ownerCompany} onChange={e=>set('ownerCompany',e.target.value)}/></div>

        <div><label style={LABEL_S}>Last Name</label><input style={INPUT_S} value={form.lastName} onChange={e=>set('lastName',e.target.value)}/></div>
      </div>
      <div style={ROW2}>
        <div><label style={LABEL_S}>Email</label><input type='email' style={INPUT_S} value={form.email} onChange={e=>set('email',e.target.value)}/></div>
        <div><label style={LABEL_S}>Phone</label><input type='tel' style={INPUT_S} value={form.phone} onChange={e=>set('phone',e.target.value)}/></div>

      {SECT('VESSEL SPECIFICATIONS')}
      <div style={ROW2}>
        <div>
          <label style={LABEL_S}>Vessel Type</label>

        <div><label style={LABEL_S}>Year Built</label><input style={INPUT_S} value={form.yearBuilt} placeholder='e.g. 1998' onChange={e=>set('yearBuilt',e.target.value)}/></div>

      <div style={ROW3}>
        <div><label style={LABEL_S}>LOA (ft)</label><input style={INPUT_S} value={form.loa} onChange={e=>set('loa',e.target.value)}/></div>
        <div><label style={LABEL_S}>Beam (ft)</label><input style={INPUT_S} value={form.beam} onChange={e=>set('beam',e.target.value)}/></div>
        <div><label style={LABEL_S}>Draft (ft)</label><input style={INPUT_S} value={form.draft} onChange={e=>set('draft',e.target.value)}/></div>
      </div>
      <div style={{marginBottom:'12px',maxWidth:'50%'}}>
        <label style={LABEL_S}>Gross Tonnage</label><input style={INPUT_S} value={form.grossTonnage} onChange={e=>set('grossTonnage',e.target.value)}/>
      </div>

      {SECT('CRM')}
      <div style={ROW2}>
        <div>
          <label style={LABEL_S}>Client Status</label>
          <select style={{...INPUT_S,...SEL_S,cursor:'pointer'}} value={form.clientStatus} onChange={e=>set('clientStatus',e.target.value)}>

          </select>
        </div>
        <div>
          <label style={LABEL_S}>Preferred Yard</label>
          <select style={{...INPUT_S,...SEL_S,cursor:'pointer'}} value={form.preferredYard} onChange={e=>set('preferredYard',e.target.value)}>
            {['Ballard','Anacortes','No Preference'].map(s=><option key={s} value={s} style={SEL_S}>{s}</option>)}
          </select>
        </div>
      </div>
      <div style={{marginBottom:'12px',maxWidth:'50%'}}>
        <label style={LABEL_S}>Last Contact Date</label>
        <input type='date' style={INPUT_S} value={form.lastContactDate} onChange={e=>set('lastContactDate',e.target.value)}/>
      </div>
      <div style={{marginBottom:'16px'}}>
        <label style={LABEL_S}>Notes</label>
        <textarea style={{...INPUT_S,resize:'vertical',minHeight:'80px'}} value={form.notes} placeholder='Relationship notes, preferences, context for future calls…' onChange={e=>set('notes',e.target.value)}/>
      </div>

      {err&&<div style={{background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.3)',borderRadius:'6px',padding:'8px 12px',fontSize:'12px',color:'#f87171',marginBottom:'12px'}}>{err}</div>}

      <div style={{display:'flex',gap:'10px',justifyContent:'flex-end'}}>
        <button onClick={onCancel} disabled={saving} style={{background:'transparent',color:'#64748b',border:'1px solid rgba(255,255,255,0.1)',padding:'8px 20px',borderRadius:'7px',fontSize:'13px',fontWeight:500,cursor:'pointer'}}>Cancel</button>
        <button onClick={handleSave} disabled={saving} style={{background:saving?'rgba(6,182,212,0.06)':'rgba(6,182,212,0.14)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.35)',padding:'8px 24px',borderRadius:'7px',fontSize:'13px',fontWeight:600,cursor:saving?'default':'pointer'}}>
          {saving?'Saving…':isEdit?'Save Changes':'Add Vessel'}
        </button>
      </div>
    </div>
  );
}

// CLIENT PROFILE
// ─────────────────────────────────────────────────────────────
function ClientProfile({client, onBack, onEdit}) {
  const c = client;
  const h = c._history || {};
  const [histTab, setHistTab] = useState('visits');
  const K = {fontSize:'11px',color:'#475569',marginBottom:'2px'};
  const V = {fontSize:'13px',color:'#94a3b8'};
  const Field = ({label,value}) => value ? (
    <div style={{marginBottom:'10px'}}><div style={K}>{label}</div><div style={V}>{value}</div></div>
  ) : null;

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <button onClick={onBack} style={{background:'transparent',color:'#06b6d4',border:'none',fontSize:'13px',cursor:'pointer',fontWeight:600,padding:0}}>← Back to Clients & Vessels</button>
        <button onClick={onEdit} style={{background:'rgba(255,255,255,0.05)',color:'#94a3b8',border:'1px solid rgba(255,255,255,0.1)',padding:'7px 16px',borderRadius:'6px',fontSize:'13px',fontWeight:500,cursor:'pointer'}}>✎ Edit</button>
      </div>

      <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderLeft:'3px solid #06b6d4',borderRadius:'10px',padding:'20px 24px',marginBottom:'20px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:'14px'}}>
          <div>
            <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'30px',fontWeight:700,color:'#f1f5f9',lineHeight:1}}>{c.vesselName}</h1>
            {c.ownerCompany&&<div style={{fontSize:'14px',color:'#94a3b8',marginTop:'5px'}}>{c.ownerCompany}</div>}
            <div style={{display:'flex',gap:'8px',marginTop:'10px',flexWrap:'wrap'}}>
              <ClientStatusBadge status={c.clientStatus}/>

              {c.preferredYard&&c.preferredYard!=='No Preference'&&<span style={{background:'rgba(6,182,212,0.08)',border:'1px solid rgba(6,182,212,0.2)',color:'#06b6d4',padding:'2px 9px',borderRadius:'4px',fontSize:'11px',fontWeight:600}}>{c.preferredYard}</span>}
            </div>
          </div>
          <div style={{display:'flex',gap:'20px',textAlign:'center',flexShrink:0}}>
            <div><div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'26px',fontWeight:700,color:'#e2e8f0'}}>{h.totalVisits||0}</div><div style={{fontSize:'10px',color:'#475569',marginTop:'2px'}}>Total Visits</div></div>
            {h.firstVisit&&<div><div style={{fontSize:'12px',fontWeight:600,color:'#64748b'}}>{fmtS(h.firstVisit)}</div><div style={{fontSize:'10px',color:'#475569',marginTop:'2px'}}>First Visit</div></div>}
            {h.lastVisit &&<div><div style={{fontSize:'12px',fontWeight:600,color:'#64748b'}}>{fmtS(h.lastVisit)}</div><div style={{fontSize:'10px',color:'#475569',marginTop:'2px'}}>Last Visit</div></div>}
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',marginBottom:'16px'}}>
        <div style={{background:'#0a1828',borderRadius:'8px',padding:'14px 16px'}}>
          <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'12px'}}>CONTACT</div>
          <Field label='Name'         value={[c.firstName,c.lastName].filter(Boolean).join(' ')||null}/>
          <Field label='Email'        value={c.email}/>
          <Field label='Phone'        value={c.phone}/>
          <Field label='Assigned Rep' value={c.assignedRep}/>
          <Field label='Last Contact' value={c.lastContactDate?fmt(c.lastContactDate):null}/>
        </div>
        <div style={{background:'#0a1828',borderRadius:'8px',padding:'14px 16px'}}>
          <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'12px'}}>VESSEL SPECS</div>
          <Field label='Type'          value={c.vesselType}/>
          <Field label='LOA'           value={c.loa?`${c.loa} ft`:null}/>
          <Field label='Beam'          value={c.beam?`${c.beam} ft`:null}/>
          <Field label='Draft'         value={c.draft?`${c.draft} ft`:null}/>
          <Field label='Gross Tonnage' value={c.grossTonnage}/>
          <Field label='Year Built'    value={c.yearBuilt}/>

      </div>

      {c.notes&&(

          <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'8px'}}>NOTES</div>

            <button key={id} onClick={()=>setHistTab(id)} style={{background:histTab===id?'#0f2044':'transparent',color:histTab===id?'#06b6d4':'#64748b',border:'none',padding:'6px 16px',borderRadius:'6px',fontSize:'12px',fontWeight:600,cursor:'pointer'}}>{label}</button>
          ))}
        </div>
      </div>

      {histTab==='visits'&&((h.schedule||[]).length===0
        ? <EmptyState icon='⚓' title='No visit history yet' sub='Visits will appear here once this vessel is added to the Schedule sheet.'/>
        : <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1.5fr 1.5fr',padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)',fontSize:'10px',color:'#475569',fontWeight:700,letterSpacing:'0.08em'}}>
            {['YARD','BERTH','ARRIVAL','DEPARTURE'].map(col=><span key={col}>{col}</span>)}
          </div>
          {(h.schedule||[]).map((v,i)=>(
            <div key={i} className='rh' style={{display:'grid',gridTemplateColumns:'1.5fr 1fr 1.5fr 1.5fr',padding:'10px 16px',borderBottom:i<(h.schedule||[]).length-1?'1px solid rgba(255,255,255,0.04)':'none',alignItems:'center'}}>
              <span style={{fontSize:'12px',color:'#94a3b8'}}>{v.yard}</span>
              <span style={{fontSize:'12px',color:'#64748b'}}>{v.berth}</span>
              <span style={{fontSize:'12px',color:'#64748b'}}>{v.arrival?fmtS(v.arrival):'—'}</span>
              <span style={{fontSize:'12px',color:'#64748b'}}>{v.departure?fmtS(v.departure):'—'}</span>
            </div>
          ))}
