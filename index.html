      )}

      {histTab==='leads'&&((h.leads||[]).length===0
        ? <EmptyState icon='📋' title='No lead history' sub='Leads submitted for this vessel will appear here.'/>
        : <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'1.5fr 2fr 1.5fr 1fr',padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)',fontSize:'10px',color:'#475569',fontWeight:700,letterSpacing:'0.08em'}}>
            {['SUBMITTED','SERVICES','REP','STATUS'].map(col=><span key={col}>{col}</span>)}
          </div>
          {(h.leads||[]).map((l,i)=>(
            <div key={i} className='rh' style={{display:'grid',gridTemplateColumns:'1.5fr 2fr 1.5fr 1fr',padding:'10px 16px',borderBottom:i<(h.leads||[]).length-1?'1px solid rgba(255,255,255,0.04)':'none',alignItems:'center'}}>
              <span style={{fontSize:'12px',color:'#64748b'}}>{l.submitted?fmtS(l.submitted):'—'}</span>
              <span style={{fontSize:'11px',color:'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.services||'—'}</span>
              <span style={{fontSize:'12px',color:'#64748b'}}>{l.rep||'—'}</span>
              <span style={{fontSize:'11px',fontWeight:600,color:(LSC[l.status]||{color:'#475569'}).color}}>{l.status}</span>
            </div>
          ))}
        </div>
      )}

      {histTab==='pipeline'&&((h.pipeline||[]).length===0
        ? <EmptyState icon='💼' title='No pipeline history' sub='Pipeline deals for this vessel will appear here.'/>
        : <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'0.5fr 1.5fr 1fr 1fr 1fr',padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)',fontSize:'10px',color:'#475569',fontWeight:700,letterSpacing:'0.08em'}}>
            {['Q','LOCATION','PERIOD','VALUE','STATUS'].map(col=><span key={col}>{col}</span>)}
          </div>
          {(h.pipeline||[]).map((p,i)=>(
            <div key={i} className='rh' style={{display:'grid',gridTemplateColumns:'0.5fr 1.5fr 1fr 1fr 1fr',padding:'10px 16px',borderBottom:i<(h.pipeline||[]).length-1?'1px solid rgba(255,255,255,0.04)':'none',alignItems:'center'}}>
              <span style={{fontSize:'11px',color:'#334155',fontWeight:700}}>Q{p.quarter}</span>
              <span style={{fontSize:'11px',color:'#60a5fa',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.yard||'—'}</span>
              <span style={{fontSize:'11px',color:'#64748b'}}>{p.period||'—'}</span>
              <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'14px',fontWeight:700,color:p.status==='won'?'#10b981':p.status==='lost'?'#475569':'#f1f5f9'}}>{p.value?fmtUSD(p.value):'—'}</span>
              <PBadge status={p.status}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// CLIENTS & VESSELS TAB
// ─────────────────────────────────────────────────────────────
function ClientsVesselsTab({refreshKey, onRefresh}) {
  const [mode,       setMode]       = useState('list');
  const [selectedId, setSelectedId] = useState(null);
  const [client,     setClient]     = useState(null);
  const [loading,    setLoading]    = useState(false);
  const [profileErr, setProfileErr] = useState('');
  const [filter,     setFilter]     = useState('all');
  const [search,     setSearch]     = useState('');

  useEffect(() => {
    if (!selectedId || mode==='list'||mode==='add') return;
    setLoading(true); setProfileErr('');
    apiFetch(`/api/clients/${selectedId}`)
      .then(r=>r.json())
      .then(d=>{
        if(d.error) throw new Error(d.error);
        // Transform raw Smartsheet fields to camelCase, attach history
        const base = transformClients([d])[0];
        setClient({...base, _history:d._history});
      })
      .catch(e=>setProfileErr(e.message))
      .finally(()=>setLoading(false));
  }, [selectedId, refreshKey]);

  const openProfile = id => { setSelectedId(id); setClient(null); setMode('profile'); };
  const openEdit    = ()  => setMode('edit');
  const backToList  = ()  => { setMode('list'); setSelectedId(null); setClient(null); };
  const handleSaved = ()  => { onRefresh(); backToList(); };

  const filtered = CLIENTS.filter(c => {
    const matchFilter = filter==='all' || c.clientStatus===filter;
    const q = search.toLowerCase();
    const matchSearch = !q || c.vesselName.toLowerCase().includes(q) || c.ownerCompany.toLowerCase().includes(q) || c.firstName.toLowerCase().includes(q) || c.lastName.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  if (mode==='add') return(
    <div>
      <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9',marginBottom:'20px'}}>Clients & Vessels</h1>
      <ClientForm initial={null} onSave={handleSaved} onCancel={backToList}/>
    </div>
  );
  if (mode==='edit'&&client) return(
    <div>
      <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9',marginBottom:'20px'}}>Clients & Vessels</h1>
      <ClientForm initial={client} onSave={handleSaved} onCancel={()=>setMode('profile')}/>
    </div>
  );
  if (mode==='profile') return(
    <div>
      <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9',marginBottom:'20px'}}>Clients & Vessels</h1>
      {loading&&<div style={{textAlign:'center',padding:'40px',color:'#06b6d4',fontSize:'13px'}}>Loading profile…</div>}
      {profileErr&&<div style={{background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.3)',borderRadius:'8px',padding:'14px',color:'#f87171',fontSize:'13px'}}>{profileErr}</div>}
      {client&&<ClientProfile client={client} onBack={backToList} onEdit={openEdit}/>}
    </div>
  );

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',flexWrap:'wrap',gap:'10px'}}>
        <div>
          <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9'}}>Clients & Vessels</h1>
          <p style={{fontSize:'13px',color:'#64748b',marginTop:'4px'}}>Vessel and client repository — both yards · {CLIENTS.length} records</p>
        </div>
        <button onClick={()=>setMode('add')} style={{background:'rgba(6,182,212,0.14)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.35)',padding:'9px 20px',borderRadius:'7px',fontSize:'13px',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>+ Add Vessel</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'10px',marginBottom:'18px'}}>
        {[['Active Clients',CLIENTS.filter(c=>c.clientStatus==='Active Client').length,'#10b981'],['Prospects',CLIENTS.filter(c=>c.clientStatus==='Prospect').length,'#60a5fa'],['Former Clients',CLIENTS.filter(c=>c.clientStatus==='Former Client').length,'#94a3b8'],['Total Records',CLIENTS.length,'#e2e8f0']].map(([label,val,color])=>(
          <div key={label} style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',padding:'14px 18px'}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'28px',fontWeight:700,color,lineHeight:1}}>{val}</div>
            <div style={{fontSize:'11px',color:'#64748b',marginTop:'4px'}}>{label}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',gap:'10px',marginBottom:'14px',flexWrap:'wrap',alignItems:'center'}}>
        <div style={{position:'relative',flex:'1',minWidth:'200px',maxWidth:'340px'}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder='Search vessels, owners, companies…' style={{...INPUT_S,paddingLeft:'32px'}}/>
          <span style={{position:'absolute',left:'10px',top:'50%',transform:'translateY(-50%)',fontSize:'14px',color:'#475569',pointerEvents:'none'}}>⌕</span>
        </div>
        {['all','Active Client','Prospect','Former Client','Inactive'].map(s=>(
          <button key={s} onClick={()=>setFilter(s)} style={{background:filter===s?'rgba(6,182,212,0.15)':'transparent',color:filter===s?'#06b6d4':'#64748b',border:filter===s?'1px solid rgba(6,182,212,0.35)':'1px solid rgba(255,255,255,0.08)',padding:'5px 14px',borderRadius:'6px',fontSize:'12px',fontWeight:500,cursor:'pointer'}}>
            {s==='all'?'All':s}
          </button>
        ))}
        <span style={{fontSize:'11px',color:'#334155'}}>{filtered.length} records</span>
      </div>

      {CLIENTS.length===0
        ? <EmptyState icon='⚓' title='No vessels in your repository yet' sub='Add vessels manually or complete the historical import from your Schedule sheet.' action={<button onClick={()=>setMode('add')} style={{background:'rgba(6,182,212,0.14)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.35)',padding:'8px 20px',borderRadius:'7px',fontSize:'13px',fontWeight:600,cursor:'pointer'}}>+ Add First Vessel</button>}/>
        : filtered.length===0
        ? <EmptyState icon='🔍' title={`No results for "${search||filter}"`} sub='Try a different search or filter.'/>
        : <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'2fr 1.5fr 0.8fr 0.9fr 1fr 1.2fr',padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)',fontSize:'10px',color:'#475569',fontWeight:700,letterSpacing:'0.08em'}}>
            {['VESSEL','OWNER / COMPANY','TYPE','PREF YARD','LAST CONTACT','STATUS'].map(col=><span key={col}>{col}</span>)}
          </div>
          {filtered.map((c,i)=>(
            <div key={c._rowId} className='rh' onClick={()=>openProfile(c._rowId)} style={{display:'grid',gridTemplateColumns:'2fr 1.5fr 0.8fr 0.9fr 1fr 1.2fr',padding:'12px 16px',alignItems:'center',borderBottom:i<filtered.length-1?'1px solid rgba(255,255,255,0.04)':'none',cursor:'pointer'}}>
              <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
                <div style={{width:'8px',height:'8px',borderRadius:'2px',background:vColor(c.vesselName),flexShrink:0}}/>
                <span style={{fontSize:'13px',color:'#e2e8f0',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.vesselName}</span>
              </div>
              <span style={{fontSize:'12px',color:'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.ownerCompany||[c.firstName,c.lastName].filter(Boolean).join(' ')||'—'}</span>
              <span style={{fontSize:'11px',color:'#64748b'}}>{c.vesselType||'—'}</span>
              <span style={{fontSize:'11px',color:'#64748b'}}>{c.preferredYard==='No Preference'?'Any':c.preferredYard||'—'}</span>
              <span style={{fontSize:'11px',color:'#64748b'}}>{c.lastContactDate?fmtS(c.lastContactDate):'—'}</span>
              <ClientStatusBadge status={c.clientStatus}/>
            </div>
          ))}
        </div>
      }
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DEAL EXPANDED (inline row detail + actions)
// ─────────────────────────────────────────────────────────────
function DealExpanded({deal, saving, onUpdateLeadStatus, onMoveToPipeline, onUpdatePipelineStatus}) {
  const r = deal._raw;
  const [localLeadStatus,     setLocalLeadStatus]     = useState(r.status||'');
  const [localPipelineStatus, setLocalPipelineStatus] = useState(r.status||'');
  const [lostReason,          setLostReason]          = useState(r.lostReason||'');
  const isDirtyLead     = deal._type==='lead'     && localLeadStatus!==r.status;
  const isDirtyPipeline = deal._type==='pipeline' && localPipelineStatus!==r.status;
  const canSaveLead     = isDirtyLead && (localLeadStatus!=='Closed — Lost' || lostReason.trim());

  return(
    <div style={{padding:'16px 20px 18px',background:'rgba(255,255,255,0.018)',borderTop:'1px solid rgba(255,255,255,0.05)'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'12px',marginBottom:'14px'}}>
        <div style={{background:'#0a1828',borderRadius:'8px',padding:'12px 14px'}}>
          <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'9px'}}>{deal._type==='lead'?'CONTACT':'DEAL DETAILS'}</div>
          {deal._type==='lead'&&[['Name',`${r.firstName||''} ${r.lastName||''}`.trim()||'—'],['Company',r.company||'—'],['Email',r.email||'—'],['Phone',r.phone||'—'],['Rep',r.assignedRep||'Unassigned']].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',gap:'8px',marginBottom:'5px'}}>
              <span style={{fontSize:'11px',color:'#475569',flexShrink:0}}>{k}</span>
              <span style={{fontSize:'11px',color:'#94a3b8',textAlign:'right',wordBreak:'break-all'}}>{v}</span>
            </div>
          ))}
          {deal._type==='pipeline'&&[['Rep',r.rep||'—'],['Location',r.loc||'—'],['Quarter',`Q${r.q}`],['Period',r.pop||'—'],['Value',r.value?fmtUSD(r.value):'—']].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',gap:'8px',marginBottom:'5px'}}>
              <span style={{fontSize:'11px',color:'#475569',flexShrink:0}}>{k}</span>
              <span style={{fontSize:'11px',color:'#94a3b8',textAlign:'right'}}>{v}</span>
            </div>
          ))}
        </div>
        <div style={{background:'#0a1828',borderRadius:'8px',padding:'12px 14px'}}>
          <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'9px'}}>VESSEL</div>
          {deal._type==='lead'&&[['Vessel',r.vessel||'—'],['Type',r.vesselType||'—'],['Yard Pref',r.yard||'—'],['LOA',r.loa?`${r.loa}ft`:'—'],['Est. Arrival',r.arrival?fmtS(r.arrival):'—'],['Duration',r.duration?`${r.duration} days`:'—']].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',gap:'8px',marginBottom:'5px'}}>
              <span style={{fontSize:'11px',color:'#475569',flexShrink:0}}>{k}</span>
              <span style={{fontSize:'11px',color:'#94a3b8',textAlign:'right'}}>{v}</span>
            </div>
          ))}
          {deal._type==='pipeline'&&<div style={{fontSize:'13px',color:'#e2e8f0',fontWeight:500,marginTop:'4px'}}>{r.vessel}</div>}
        </div>
        <div style={{background:'#0a1828',borderRadius:'8px',padding:'12px 14px'}}>
          <div style={{fontSize:'10px',fontWeight:700,color:'#334155',letterSpacing:'0.1em',marginBottom:'9px'}}>NOTES</div>
          <div style={{fontSize:'12px',color:'#94a3b8',lineHeight:'1.6'}}>{(deal._type==='lead'?(r.description||r.services||''):r.notes)||'—'}</div>
          {deal._type==='lead'&&r.budget&&<div style={{marginTop:'8px',fontSize:'11px',color:'#64748b'}}>Budget: {r.budget}</div>}
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:'8px',paddingTop:'4px',borderTop:'1px solid rgba(255,255,255,0.05)'}}>
        {deal._type==='lead'&&(
          <div style={{display:'flex',alignItems:'flex-end',gap:'10px',flexWrap:'wrap'}}>
            <div>
              <label style={LABEL_S}>Update Status</label>
              <select value={localLeadStatus} onChange={e=>setLocalLeadStatus(e.target.value)} disabled={saving}
                style={{...INPUT_S,cursor:'pointer',...SEL_S,width:'auto',minWidth:'200px'}}>
                {Object.keys(LSC).filter(s=>s!=='Moved to Pipeline').map(s=><option key={s} value={s} style={SEL_S}>{s}</option>)}
              </select>
            </div>
            {r.status!=='Moved to Pipeline'&&r.status!=='Closed — Lost'&&(
              <button onClick={()=>onMoveToPipeline(r)} disabled={saving} style={{background:'rgba(16,185,129,0.14)',color:'#10b981',border:'1px solid rgba(16,185,129,0.35)',padding:'7px 16px',borderRadius:'6px',fontSize:'13px',fontWeight:600,cursor:saving?'default':'pointer',whiteSpace:'nowrap'}}>
                {saving?'Moving…':'→ Add to Pipeline'}
              </button>
            )}
            {isDirtyLead&&(
              <button onClick={()=>onUpdateLeadStatus(r,localLeadStatus,lostReason)} disabled={saving||!canSaveLead}
                style={{background:canSaveLead?'rgba(6,182,212,0.14)':'rgba(255,255,255,0.05)',color:canSaveLead?'#06b6d4':'#475569',border:`1px solid ${canSaveLead?'rgba(6,182,212,0.35)':'rgba(255,255,255,0.1)'}`,padding:'7px 16px',borderRadius:'6px',fontSize:'13px',fontWeight:600,cursor:canSaveLead?'pointer':'default'}}>
                {saving?'Saving…':'Save Status'}
              </button>
            )}
          </div>
        )}
        {deal._type==='lead'&&localLeadStatus==='Closed — Lost'&&(
          <div>
            <label style={{...LABEL_S,color:'#f87171'}}>Lost Reason <span style={{color:'#64748b'}}>(required to save)</span></label>
            <textarea value={lostReason} onChange={e=>setLostReason(e.target.value)} placeholder='Why was this opportunity lost?' style={{...INPUT_S,resize:'vertical',minHeight:'52px',borderColor:'rgba(248,113,113,0.25)'}}/>
          </div>
        )}
        {deal._type==='pipeline'&&(
          <div style={{display:'flex',alignItems:'flex-end',gap:'10px',flexWrap:'wrap'}}>
            <div>
              <label style={LABEL_S}>Deal Status</label>
              <select value={localPipelineStatus} onChange={e=>setLocalPipelineStatus(e.target.value)} disabled={saving}
                style={{...INPUT_S,cursor:'pointer',...SEL_S,width:'auto',minWidth:'200px'}}>
                {[['lead','Lead'],['estimating','Estimating'],['won','Closed – Won'],['lost','Closed – Lost']].map(([v,l])=><option key={v} value={v} style={SEL_S}>{l}</option>)}
              </select>
            </div>
            {isDirtyPipeline&&(
              <button onClick={()=>onUpdatePipelineStatus(r,localPipelineStatus)} disabled={saving}
                style={{background:'rgba(6,182,212,0.14)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.35)',padding:'7px 16px',borderRadius:'6px',fontSize:'13px',fontWeight:600,cursor:saving?'default':'pointer'}}>
                {saving?'Saving…':'Save Status'}
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// SALES TAB
// ─────────────────────────────────────────────────────────────
function SalesTab({onRefresh}) {
  const [stage,    setStage]    = useState('all');
  const [expanded, setExpanded] = useState(null);
  const [saving,   setSaving]   = useState(null);
  const [actionErr,setActionErr]= useState('');

  // Build unified deal list
  const deals = [];
  LEADS.filter(l=>l.status!=='Moved to Pipeline').forEach(l=>{
    const stageKey = {'New — Needs Review':'new','Contacted':'contacted','Quoted':'quoted','Closed — Lost':'lost'}[l.status]||'new';
    deals.push({_id:`lead-${l._rowId}`,_type:'lead',_rowId:l._rowId,stageKey,stageLabel:l.status,vessel:l.vessel||'—',company:l.company||'—',rep:l.assignedRep||'—',yard:l.yard==='No Preference'?'Any':(l.yard||'—'),value:null,date:l.arrival||l.submitted||'',notes:(l.description||l.services||'').slice(0,80),quarter:null,_raw:l});
  });
  PIPELINE.forEach(p=>{
    const stageKey = {'lead':'in_progress','estimating':'in_progress','won':'won','lost':'lost'}[p.status]||'in_progress';
    deals.push({_id:`pipeline-${p._rowId}`,_type:'pipeline',_rowId:p._rowId,stageKey,stageLabel:(PSC[p.status]||{label:p.status}).label,vessel:p.vessel||'—',company:'—',rep:p.rep||'—',yard:p.loc||'—',value:p.value||null,date:p.pop||'',notes:(p.notes||'').slice(0,80),quarter:p.q,_raw:p});
  });
  const order={new:0,contacted:1,quoted:2,in_progress:3,won:4,lost:5};
  deals.sort((a,b)=>(order[a.stageKey]||0)-(order[b.stageKey]||0));
  const filtered = stage==='all' ? deals : deals.filter(d=>d.stageKey===stage);

  const wonQ    = PIPELINE.filter(p=>p.status==='won'&&p.q===CURR_Q).reduce((a,p)=>a+p.value,0);
  const estQ    = PIPELINE.filter(p=>p.status==='estimating').reduce((a,p)=>a+p.value,0);
  const newCount= LEADS.filter(l=>l.status==='New — Needs Review').length;
  const totP    = PIPELINE.reduce((a,p)=>a+p.value,0);

  const updateLeadStatus = async (lead, newStatus, lostReason='') => {
    setSaving(`lead-${lead._rowId}`); setActionErr('');
    const payload={'Lead Status':newStatus};
    if(newStatus==='Closed — Lost'&&lostReason.trim()) payload['Lost Reason']=lostReason.trim();
    try {
      const r=await apiFetch(`/api/leads/${lead._rowId}`,{method:'PUT',body:JSON.stringify(payload)});
      if(r.ok){setExpanded(null);onRefresh();}
      else{const d=await r.json().catch(()=>({}));setActionErr(d.error||`Update failed (${r.status})`);}
    } catch(e){setActionErr(e.message);}
    finally{setSaving(null);}
  };

  const moveToPipeline = async (lead) => {
    setSaving(`lead-${lead._rowId}`); setActionErr('');
    try {
      const q=lead.arrival?`Q${Math.ceil((parseDate(lead.arrival).getMonth()+1)/3)}`:`Q${CURR_Q}`;
      const YMAP={'Ballard (Seattle)':'Ballard','Anacortes':'Anacortes','Ballard':'Ballard','Off Site':'Off Site'};
      const pPayload={'Vessel Name':lead.vessel,'Status':'Lead','Quarter':q,'Value ($)':0,'Notes':`From Intake — Services: ${lead.services||'—'}${lead.description?' | '+lead.description:''}`.trim(),'Period':lead.arrival||''};
      const yName=YMAP[lead.yard];
      if(yName) pPayload['Yard']=yName;
      const pR=await apiFetch('/api/pipeline',{method:'POST',body:JSON.stringify(pPayload)});
      if(!pR.ok){const e=await pR.json();throw new Error(`Pipeline add failed: ${e.error||JSON.stringify(e)}`);}
      await apiFetch(`/api/leads/${lead._rowId}`,{method:'PUT',body:JSON.stringify({'Lead Status':'Moved to Pipeline'})});
      setExpanded(null); onRefresh();
    } catch(e){setActionErr(e.message);}
    finally{setSaving(null);}
  };

  const updatePipelineStatus = async (item, newStatus) => {
    setSaving(`pipeline-${item._rowId}`); setActionErr('');
    // Map internal key → Smartsheet PICKLIST value
    const capMap={won:'Won',lost:'Closed - Lost',lead:'Lead',estimating:'Estimating'};
    try {
      const r=await apiFetch(`/api/pipeline/${item._rowId}`,{method:'PUT',body:JSON.stringify({'Status':capMap[newStatus]||newStatus})});
      if(r.ok){setExpanded(null);onRefresh();}
      else{const d=await r.json().catch(()=>({}));setActionErr(d.error||`Update failed (${r.status})`);}
    } catch(e){setActionErr(e.message);}
    finally{setSaving(null);}
  };

  const pillStyle = (s,active) => ({background:active?'rgba(6,182,212,0.15)':'transparent',color:active?'#06b6d4':'#64748b',border:active?'1px solid rgba(6,182,212,0.35)':'1px solid rgba(255,255,255,0.08)',padding:'5px 14px',borderRadius:'6px',fontSize:'12px',fontWeight:500,cursor:'pointer'});

  return(
    <div>
      <div style={{marginBottom:'20px'}}>
        <h1 style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'34px',fontWeight:700,color:'#f1f5f9'}}>Sales</h1>
        <p style={{fontSize:'13px',color:'#64748b',marginTop:'4px'}}>All leads and deals — from first contact to closed won</p>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'10px',marginBottom:'20px'}}>
        {[['New Leads',newCount,'#60a5fa',false],[`Won Q${CURR_Q}`,wonQ,'#10b981',true],['In Estimating',estQ,'#f59e0b',true],['Total Pipeline',totP,'#e2e8f0',true]].map(([label,val,color,isUSD])=>(
          <div key={label} style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',padding:'16px 18px'}}>
            <div style={{fontSize:'11px',color:'#64748b',marginBottom:'8px'}}>{label}</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'26px',fontWeight:700,color}}>{isUSD?fmtUSD(val):val}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',gap:'6px',marginBottom:'14px',flexWrap:'wrap',alignItems:'center'}}>
        {[['all','All Deals'],['new','New Lead'],['contacted','Contacted'],['quoted','Quoted'],['in_progress','In Progress'],['won','Won'],['lost','Lost']].map(([s,label])=>(
          <button key={s} onClick={()=>setStage(s)} style={pillStyle(s,stage===s)}>{label}</button>
        ))}
        <span style={{fontSize:'11px',color:'#334155',marginLeft:'4px'}}>{filtered.length} records</span>
      </div>

      {actionErr&&(
        <div style={{background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.3)',borderRadius:'8px',padding:'10px 16px',marginBottom:'14px',fontSize:'12px',color:'#f87171',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>⚠ {actionErr}</span>
          <button onClick={()=>setActionErr('')} style={{background:'transparent',border:'none',color:'#f87171',cursor:'pointer',fontSize:'16px',lineHeight:1}}>×</button>
        </div>
      )}

      {filtered.length===0
        ? <EmptyState icon='📋' title='No deals in this stage' sub='Try a different filter, or add a new lead via the intake form.'/>
        : <div style={{background:'#0d1728',border:'1px solid rgba(255,255,255,0.07)',borderRadius:'10px',overflow:'hidden'}}>
          <div style={{display:'grid',gridTemplateColumns:'1.2fr 1.4fr 1fr 0.9fr 0.8fr 1.4fr',padding:'10px 16px',borderBottom:'1px solid rgba(255,255,255,0.08)',fontSize:'10px',color:'#475569',fontWeight:700,letterSpacing:'0.08em'}}>
            {['VESSEL','COMPANY / REP','YARD','DATE','VALUE','STAGE'].map(col=><span key={col}>{col}</span>)}
          </div>
          {filtered.map((deal,i)=>{
            const iExp     = expanded===deal._id;
            const isSaving = saving===deal._id;
            const isLast   = i===filtered.length-1;
            return(
              <Fragment key={deal._id}>
                <div onClick={()=>setExpanded(iExp?null:deal._id)} className='rh'
                  style={{display:'grid',gridTemplateColumns:'1.2fr 1.4fr 1fr 0.9fr 0.8fr 1.4fr',padding:'12px 16px',alignItems:'center',cursor:'pointer',borderBottom:(!isLast||iExp)?'1px solid rgba(255,255,255,0.04)':'none',background:iExp?'rgba(255,255,255,0.025)':'transparent'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <div style={{width:'3px',height:'28px',borderRadius:'2px',background:deal._type==='lead'?'#60a5fa':'#a78bfa',flexShrink:0}}/>
                    <span style={{fontSize:'13px',color:'#e2e8f0',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{deal.vessel}</span>
                  </div>
                  <div>
                    <div style={{fontSize:'12px',color:'#94a3b8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{deal.company!=='—'?deal.company:deal.rep}</div>
                    <div style={{fontSize:'10px',color:'#334155',marginTop:'2px'}}>{deal._type==='lead'?'Lead':'Pipeline'}{deal.quarter?` · Q${deal.quarter}`:''}</div>
                  </div>
                  <span style={{fontSize:'11px',color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{deal.yard}</span>
                  <span style={{fontSize:'11px',color:'#64748b'}}>{deal.date?fmtS(deal.date):'—'}</span>
                  <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'14px',fontWeight:700,color:deal.stageKey==='won'?'#10b981':deal.value?'#f1f5f9':'#334155'}}>{deal.value?fmtUSD(deal.value):'—'}</span>
                  <StageBadge stage={deal.stageKey} label={deal.stageLabel}/>
                </div>
                {iExp&&<DealExpanded deal={deal} saving={isSaving} onUpdateLeadStatus={updateLeadStatus} onMoveToPipeline={moveToPipeline} onUpdatePipelineStatus={updatePipelineStatus}/>}
              </Fragment>
            );
          })}
        </div>
      }
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// APP SHELL
// ─────────────────────────────────────────────────────────────
function App() {
  const [ready,      setReady]      = useState(false);
  const [err,        setErr]        = useState(null);
  const [view,       setView]       = useState('home');
  const [refreshKey, setRefreshKey] = useState(0);
  const [token,      setToken]      = useState(()=>{ const s=sessionStorage.getItem('dockops_token'); if(s) API_TOKEN=s; return s||''; });
  const [keyInput,   setKeyInput]   = useState('');
  const [checking,   setChecking]   = useState(false);
  const [authErr,    setAuthErr]    = useState(false);

  const handleRefresh = () => {
    loadFromSmartsheet().then(()=>setRefreshKey(k=>k+1)).catch(e=>console.error('Refresh failed:',e));
  };

  useEffect(()=>{ if(!token)return; loadFromSmartsheet().then(()=>setReady(true)).catch(e=>setErr(e.message)); },[token]);
  useEffect(()=>{
    if(!token)return;
    const id=setInterval(()=>{loadFromSmartsheet().then(()=>setRefreshKey(k=>k+1)).catch(e=>console.warn('Auto-refresh failed:',e));},5*60*1000);
    return()=>clearInterval(id);
  },[token]);

  const tryLogin = async () => {
    const k=keyInput.trim(); if(!k)return;
    setChecking(true); setAuthErr(false);
    try {
      const r=await fetch(`${API}/api/berths`,{headers:{Authorization:`Bearer ${k}`}});
      if(r.ok){ API_TOKEN=k; sessionStorage.setItem('dockops_token',k); setToken(k); }
      else { setAuthErr(true); }
    } catch(e){ setAuthErr(true); }
    finally { setChecking(false); }
  };

  // ── AUTH ───────────────────────────────────────────────────
  if(!token) return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:'18px',background:'#080c14'}}>
      <div style={{width:'50px',height:'50px',borderRadius:'12px',background:'linear-gradient(135deg,#0891b2,#06b6d4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px'}}>⚓</div>
      <div style={{textAlign:'center'}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'28px',fontWeight:700,color:'#f1f5f9',letterSpacing:'0.02em'}}>DockOps</div>
        <div style={{fontSize:'10px',color:'#2d4a6a',letterSpacing:'0.12em',marginTop:'3px'}}>STABBERT MARINE & INDUSTRIAL</div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'10px',width:'300px'}}>
        <input type='password' placeholder='Enter access key' value={keyInput} onChange={e=>setKeyInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryLogin()} style={{...INPUT_S,padding:'11px 14px',fontSize:'14px',border:'1px solid rgba(255,255,255,0.12)'}}/>
        {authErr&&<div style={{fontSize:'12px',color:'#f87171',textAlign:'center'}}>Invalid access key — please try again</div>}
        <button onClick={tryLogin} disabled={checking} style={{background:'rgba(6,182,212,0.15)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.35)',padding:'11px',borderRadius:'8px',fontSize:'14px',fontWeight:600,cursor:checking?'default':'pointer'}}>
          {checking?'Verifying…':'Access DockOps'}
        </button>
      </div>
    </div>
  );

  // ── ERROR ──────────────────────────────────────────────────
  if(err) return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:'16px',background:'#080c14'}}>
      <div style={{fontSize:'32px'}}>⚠️</div>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'22px',fontWeight:700,color:'#f87171'}}>Smartsheet Connection Failed</div>
      <div style={{fontSize:'13px',color:'#475569',maxWidth:'380px',textAlign:'center'}}>{err}</div>
      <button onClick={()=>{setErr(null);loadFromSmartsheet().then(()=>setReady(true)).catch(e=>setErr(e.message));}} style={{marginTop:'8px',background:'rgba(6,182,212,0.12)',color:'#06b6d4',border:'1px solid rgba(6,182,212,0.3)',padding:'8px 22px',borderRadius:'6px',fontSize:'13px',fontWeight:600,cursor:'pointer'}}>Retry Connection</button>
    </div>
  );

  // ── LOADING ────────────────────────────────────────────────
  if(!ready) return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:'20px',background:'#080c14'}}>
      <div style={{width:'44px',height:'44px',borderRadius:'10px',background:'linear-gradient(135deg,#0891b2,#06b6d4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px'}}>⚓</div>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'26px',fontWeight:700,color:'#f1f5f9',letterSpacing:'0.02em'}}>DockOps</div>
      <div style={{fontSize:'13px',color:'#06b6d4'}}>Connecting to Smartsheet…</div>
      <div style={{width:'220px',height:'3px',background:'rgba(255,255,255,0.08)',borderRadius:'2px',overflow:'hidden'}}>
        <div style={{height:'100%',width:'35%',background:'linear-gradient(90deg,#0891b2,#06b6d4)',borderRadius:'2px',animation:'slideLoad 1.4s ease-in-out infinite'}}/>
      </div>
    </div>
  );

  const newLeadCount = LEADS.filter(l=>l.status==='New — Needs Review').length;

  return(
    <div style={{minHeight:'100vh',background:'#080c14'}}>
      <nav style={{background:'#09101f',borderBottom:'1px solid rgba(255,255,255,0.07)',padding:'0 24px',display:'flex',alignItems:'center',gap:'6px',height:'60px',position:'sticky',top:0,zIndex:100}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginRight:'20px',flexShrink:0}}>
          <div style={{width:'34px',height:'34px',borderRadius:'8px',background:'linear-gradient(135deg,#0891b2,#06b6d4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px'}}>⚓</div>
          <div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:'18px',fontWeight:700,color:'#f1f5f9',lineHeight:1}}>DockOps</div>
            <div style={{fontSize:'9px',color:'#2d4a6a',letterSpacing:'0.08em',marginTop:'1px'}}>STABBERT MARINE & INDUSTRIAL</div>
          </div>
        </div>
        {[['home','Home'],['yard','Yard'],['clients','Clients & Vessels'],['sales','Sales']].map(([id,label])=>{
          const badge = id==='sales'?newLeadCount:0;
          const active = view===id;
          return(
            <button key={id} onClick={()=>setView(id)} style={{background:active?'rgba(6,182,212,0.12)':'transparent',color:active?'#06b6d4':'#64748b',border:active?'1px solid rgba(6,182,212,0.28)':'1px solid transparent',padding:'6px 16px',borderRadius:'6px',fontSize:'13px',fontWeight:500,display:'flex',alignItems:'center',gap:'6px',whiteSpace:'nowrap',cursor:'pointer'}}>
              {label}
              {badge>0&&<span style={{background:'#60a5fa',color:'#000',borderRadius:'10px',padding:'1px 7px',fontSize:'10px',fontWeight:700,lineHeight:1.4}}>{badge}</span>}
            </button>
          );
        })}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'7px'}}>
          <span style={{width:'7px',height:'7px',borderRadius:'50%',background:'#10b981',display:'inline-block',boxShadow:'0 0 8px rgba(16,185,129,0.5)'}}/>
          <span style={{fontSize:'12px',color:'#475569'}}>Live · Smartsheet</span>
        </div>
      </nav>

      <main style={{padding:'28px 24px',maxWidth:'1440px',margin:'0 auto'}}>
        {view==='home'    && <HomeTab key={refreshKey} onNavigate={setView}/>}
        {view==='yard'    && <YardTab key={refreshKey} onRefresh={handleRefresh}/>}
        {view==='clients' && <ClientsVesselsTab key={refreshKey} refreshKey={refreshKey} onRefresh={handleRefresh}/>}
        {view==='sales'   && <SalesTab key={refreshKey} onRefresh={handleRefresh}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
